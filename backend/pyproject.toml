[project]
name = "geo-assistant-backend"
version = "0.1.0"
description = "AI assistant for Generative Engine Optimization (GEO) content analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",   # file uploads
    "httpx>=0.27",
    "litellm>=1.55",              # unified model gateway (role #1 brain)
    "trafilatura>=1.12",         # main-content extraction
    "selectolax>=0.3.21",        # fast HTML parsing for signals
    "pymupdf>=1.24",             # PDF parsing
    "python-docx>=1.1",          # Word parsing
    "playwright>=1.48",          # JS rendering + PDF export
    "sqlmodel>=0.0.22",          # SQLite ORM
    "aiosqlite>=0.20",           # async sqlite driver
    "tenacity>=9.0",             # retries
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
